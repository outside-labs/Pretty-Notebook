name: Test pnbp

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pnbp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable . pytest ruff

      - name: Compile Python sources
        run: python -W error -m compileall -q src apps/web tests

      - name: Check release-blocking lint rules
        run: python -m ruff check --select E9,F63,F7,F82,W605 src apps/web tests

      - name: Run tests
        run: python -m pytest

  package:
    name: Build and inspect distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check --strict dist/*

      - name: Test the installed wheel
        shell: bash
        run: |
          test_venv="${RUNNER_TEMP}/pnbp-wheel-test"
          note_path="${RUNNER_TEMP}/pnbp-smoke-notes"

          python -m venv "$test_venv"
          "$test_venv/bin/python" -m pip install dist/*.whl
          "$test_venv/bin/python" -c "import pnbp"
          "$test_venv/bin/pnbp" --help

          mkdir -p "$note_path"
          printf '#public\nHello.\n' > "$note_path/example.md"

          NOTE_PATH="$note_path" PNBP_SETTINGS=off \
            "$test_venv/bin/python" -c \
            'from pnbp import Notebook; nb = Notebook(); assert "example" in nb.notes'
