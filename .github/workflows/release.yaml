name: Publish pnbp to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pnbp-pypi-release
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify pnbp
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify release tag matches package version
        shell: bash
        run: |
          package_version="$(python -c 'import tomllib; f=open("pyproject.toml", "rb"); print(tomllib.load(f)["project"]["version"])')"

          if [[ "${GITHUB_REF_NAME}" != "v${package_version}" ]]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} must equal v${package_version}"
            exit 1
          fi

      - name: Install project, test, check, and build tools
        run: |
          python -m pip install --upgrade build twine ruff pytest
          python -m pip install --editable .

      - name: Check Python source
        run: |
          python -W error -m compileall -q src apps/web tests
          python -m ruff check --select E9,F63,F7,F82,W605 src apps/web tests

      - name: Run core regression suite
        run: python -m pytest -q

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check --strict dist/*

      - name: Test installed wheel
        shell: bash
        run: |
          test_venv="${RUNNER_TEMP}/pnbp-release-test"
          note_path="${RUNNER_TEMP}/pnbp-smoke-notes"

          python -m venv "$test_venv"
          "$test_venv/bin/python" -m pip install dist/*.whl
          "$test_venv/bin/python" -m pip check
          "$test_venv/bin/python" -c "import pnbp"
          "$test_venv/bin/pnbp" --help

          mkdir -p "$note_path"
          printf '#public\nHello.\n' > "$note_path/example.md"

          NOTE_PATH="$note_path" PNBP_SETTINGS=off \
            "$test_venv/bin/python" -c \
            'from pnbp import Notebook; nb = Notebook(); assert "example" in nb.notes'

      - name: Store distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish pnbp to PyPI
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/pnbp/

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1