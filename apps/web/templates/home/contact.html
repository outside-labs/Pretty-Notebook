{% extends 'shared/layout.html' %}

{% block content %}
<h1>Contact</h1>
{% if form_sent %}<p role="status">Your message was saved locally.</p>{% endif %}
{% if form_error %}<p role="alert">{{ form_error }}</p>{% endif %}
<form action="/forms/contact" method="POST">
  <div class="form-group">
    <label for="email_address">Email address</label>
    <input type="email" class="form-control" id="email_address" name="email_address" maxlength="254" required>
  </div>
  <div class="form-group">
    <label for="email_message">Message</label>
    <textarea class="form-control" id="email_message" name="email_message" maxlength="5000" rows="3" required></textarea>
  </div>
  <button type="submit" class="btn btn-primary">Save message</button>
</form>
{% endblock %}
