<header class="site-header">
  <nav class="shell site-nav" aria-label="Main navigation">
    <a class="site-brand" href="{{ root_path }}/">{{ NAV_BRAND | safe }}</a>
    <ul class="nav-list">{{ NAV_PAGES | safe }}</ul>
    <form class="theme-form" action="{{ root_path }}/theme" method="POST">
      <input type="hidden" name="return_to" value="{{ request.url.path }}">
      <button type="submit" class="button button-secondary" name="darkmode" value="{{ 'lightmode' if darkmode else 'darkmode' }}">
        <i class="bi {{ 'bi-eye-fill' if darkmode else 'bi-eye' }}" aria-hidden="true"></i>
        {{ 'Light theme' if darkmode else 'Dark theme' }}
      </button>
    </form>
  </nav>
</header>
