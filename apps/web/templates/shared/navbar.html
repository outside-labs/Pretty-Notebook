<header class="site-header">
  <nav class="shell site-nav" aria-label="Main navigation">
    <a class="site-brand" href="{{ root_path }}/"><svg class="appearance-icon" aria-hidden="true" focusable="false"><use href="{{ root_path }}/static/icons/appearance.svg#book-open"></use></svg><span>{{ NAV_BRAND | safe }}</span></a>
    <form class="theme-form" action="{{ root_path }}/theme" method="POST">
      <input type="hidden" name="return_to" value="{{ request.url.path }}">
      <button type="submit" class="button button-secondary" name="darkmode" data-theme-toggle
              aria-label="{{ 'Light theme' if darkmode else 'Dark theme' }}" value="{{ 'lightmode' if darkmode else 'darkmode' }}">
        <svg class="appearance-icon" aria-hidden="true" focusable="false"><use href="{{ root_path }}/static/icons/appearance.svg#sun"></use></svg>
        <span data-theme-label class="control-label{% if not APPEARANCE.button_labels %} visually-hidden{% endif %}">{{ 'Light theme' if darkmode else 'Dark theme' }}</span>
      </button>
    </form>
    <details class="site-menu">
    <summary class="button button-secondary nav-toggle" aria-controls="site-navigation" aria-label="Menu">
      <svg class="appearance-icon" aria-hidden="true" focusable="false"><use href="{{ root_path }}/static/icons/appearance.svg#menu"></use></svg><span class="control-label{% if not APPEARANCE.button_labels %} visually-hidden{% endif %}">Menu</span>
    </summary>
    <div id="site-navigation" class="nav-panel">
      <ul class="nav-list">{{ NAV_PAGES | safe }}<li><a class="nav-link" href="{{ root_path }}/n/search">Search</a></li><li><a class="nav-link" href="{{ root_path }}/appearance">Appearance</a></li></ul>
      <details class="appearance-picker">
        <summary>Quick appearance</summary>
        <form action="{{ root_path }}/appearance" method="POST" class="stack">
          <input type="hidden" name="return_to" value="{{ request.url.path }}">
          <label>Mode<select name="mode">
            {% for value in ['light', 'dark', 'system'] %}<option value="{{ value }}"{% if appearance_mode == value %} selected{% endif %}>{{ value | title }}</option>{% endfor %}
          </select></label>
          <label>Font<select name="font">
            {% for value in ['sans', 'serif', 'mono'] %}<option value="{{ value }}"{% if appearance_font == value %} selected{% endif %}>{{ value | title }}</option>{% endfor %}
          </select></label>
          <button class="button" type="submit">Save appearance</button>
          <a href="{{ root_path }}/appearance">Appearance preferences</a>
        </form>
      </details>
    </div>
    </details>
  </nav>
</header>
