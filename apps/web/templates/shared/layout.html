<!DOCTYPE html>
<html lang="en" data-palette="{{ APPEARANCE.palette }}" data-theme="{{ 'dark' if darkmode else 'light' }}" data-mode="{{ appearance_mode }}"
      data-font="{{ appearance_font }}" data-heading-font="{{ APPEARANCE.heading_font }}" data-density="{{ APPEARANCE.density }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page_title and page_title != TITLE %}{{ page_title }} · {% endif %}{{ TITLE }}</title>
    {% if favicon_url %}<link rel="icon" type="image/png" href="{{ favicon_url }}">{% endif %}
    <link href="{{ root_path }}/static/css/site.css" rel="stylesheet">
    <link href="{{ root_path }}/static/css/themes/{{ APPEARANCE.palette }}.css" rel="stylesheet">
    {% block appearance_styles %}{% endblock %}
    <style>
      :root { {{ appearance_tokens | safe }} }
      @media (max-width: {{ APPEARANCE.nav_breakpoint }}px) {
        .site-nav { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 0.5rem; }
        .site-brand { max-width: 100%; min-width: 0; }
        .nav-panel { grid-column: 1 / -1; order: 4; flex-direction: column; align-items: stretch; }
        .nav-list { flex-direction: column; }
        .appearance-picker form { position: static; width: 100%; }
        .site-nav .button { padding-inline: 0.5rem; }
        .theme-form .control-label { max-width: 3.5em; }
      }
    </style>
    {% if APPEARANCE.custom_css %}<link href="{{ root_path }}/static/custom/appearance.css" rel="stylesheet">{% endif %}
    <script src="{{ root_path }}/static/js/appearance.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% include 'shared/navbar.html' %}
    <script defer src="{{ root_path }}/static/js/site-navigation.js"></script>
    <main id="main-content" class="shell page-content" tabindex="-1">
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
      <div class="shell">{{ FOOTER | safe }}</div>
    </footer>
    {% if diagram_mode %}
    <script defer src="{{ root_path }}/static/js/diagram-loader.js"
            data-mermaid-src="{{ assets['mermaid-js'].url }}"
            data-mermaid-integrity="{{ assets['mermaid-js'].integrity }}"
            data-mermaid-theme="{{ merm_dark if darkmode else merm_light }}"
            data-mermaid-light="{{ merm_light }}" data-mermaid-dark="{{ merm_dark }}"
            data-diagram-mode="{{ diagram_mode }}"></script>
    {% endif %}
    {% if code_mode %}
    <script defer src="{{ root_path }}/static/js/code-tools.js"
            data-highlight="{{ 'on' if highlight_code else 'off' }}"
            data-highlight-src="{{ assets['highlight-js'].url }}"
            data-highlight-integrity="{{ assets['highlight-js'].integrity }}"
            data-highlight-style="{{ assets['highlight-css'].url }}"
            data-highlight-style-light="{{ assets['highlight-css-light'].url }}"
            data-highlight-style-dark="{{ assets['highlight-css-dark'].url }}"
            data-highlight-integrity-light="{{ assets['highlight-css-light'].integrity }}"
            data-highlight-integrity-dark="{{ assets['highlight-css-dark'].integrity }}"
            data-highlight-style-integrity="{{ assets['highlight-css'].integrity }}"></script>
    {% endif %}
  </body>
</html>
