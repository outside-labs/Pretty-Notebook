[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "pnbp"
version = "0.9.0"
description = "Python tools for parsing and querying wiki-linked, tagged Markdown notebooks."
readme = "docs/pnbp.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "prettynb" },
]
maintainers = [
    { name = "Outside Labs" },
]

keywords = [
    "markdown",
    "notes",
    "wikilinks",
    "knowledge-management",
]

dependencies = [
    "click>=8.0",
    "markdown>=3.3.4",
    "requests>=2.26",
    "rich>=10.6",
]

[project.urls]
Homepage = "https://outside-labs.com"
Repository = "https://github.com/outside-labs/pretty-notebook"
Documentation = "https://github.com/outside-labs/pretty-notebook/tree/main/docs"
Issues = "https://github.com/outside-labs/pretty-notebook/issues"

[project.scripts]
pnbp = "pnbp.cli:cli"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["pnbp*"]
namespaces = false