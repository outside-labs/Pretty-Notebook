{% extends "shared/layout.html" %}

{% block content %}


<div class="container-fluid">
	<div id="quote" class="alert alert-info alert-dismissible fade show" role="alert">
		<blockquote class="blockquote text-left">
			<h6 class="mb-0 text-info"><i>“{{quote.quote}}”</i></h6>
		</blockquote>
		<footer class="blockquote-footer">{{quote.author}} | <a title="Source Title" href="{{quote.site_link}}">{{quote.site_name}}</a></footer>
		<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
	</div>
	<img class="img-fluid" src='static/imgs/Scan.jpeg'>
   <div class="container" style="margin-top: 500px;">
   		<img class="img-fluid" src='static/imgs/flock-1837494_1280.png'>
	</div>

</div>


{% endblock %}
